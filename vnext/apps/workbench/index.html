<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Content OS vNext</title><link rel="stylesheet" href="/workbench.css"></head>
<body><div id="app">
<header class="topbar"><div class="brand">Content OS <small data-i18n="brandVersion"></small></div><label><span data-i18n="project"></span><select id="projectSelect"></select></label><button id="newProject" data-i18n="newProject"></button><label><span data-i18n="character"></span><select id="characterSelect"></select></label><label><span data-i18n="style"></span><select id="styleSelect"></select></label><label><span data-i18n="voice"></span><select id="voiceSelect"></select></label><label><span data-i18n="render"></span><select id="renderSelect"><option value="preview-1080p">1080p</option><option value="preview-720p">720p</option></select></label><button id="languageToggle" data-i18n="languageToggle"></button></header>
<div class="layout"><aside class="sidebar"><h2 data-i18n="workflow"></h2><nav id="workflow"></nav></aside><main class="main"><div class="sectionhead"><h1 id="nodeTitle"></h1><span id="projectState" class="badge"></span></div><div id="workflowStatus"></div><div id="workspace"></div></main><aside class="inspector"><h2 data-i18n="inspector"></h2><div id="inspector"></div></aside></div>
<div class="bottom"><div class="tabs" id="bottomTabs"></div><div id="bottomContent"></div></div>
<dialog id="projectDialog"><form method="dialog"><h3 data-i18n="newProject"></h3><label data-i18n="projectName"></label><input id="newProjectName" required><label data-i18n="settings.topic"></label><input id="newProjectTopic" required><label data-i18n="contentType"></label><select id="newProjectContentType"><option value="EXPLAINER" data-i18n="contentTypeExplainer"></option><option value="COMMENTARY" data-i18n="contentTypeCommentary"></option><option value="TUTORIAL" data-i18n="contentTypeTutorial"></option></select><div class="row"><button value="cancel" data-i18n="cancel"></button><button id="confirmProject" class="primary" value="create" data-i18n="create"></button></div></form></dialog><div id="toast" role="status"></div></div><script type="module" src="/workbench.js"></script></body></html>
